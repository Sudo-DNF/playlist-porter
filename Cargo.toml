[package]
name = "playlist-porter"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/Sudo-DNF/playlist-porter"
description = "Export your own playlists to CSV/JSON or recreate them as private YouTube playlists. Personal, non-commercial use."
publish = false

[lib]
name = "playlist_porter"
path = "src/lib.rs"

[[bin]]
name = "playlist-porter"
path = "src/main.rs"

[dependencies]
# GUI. egui, eframe and egui_extras must stay on the same version.
# eframe's default features do not include `persistence`, which stays off.
eframe = "=0.37.0"
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false }
rfd = "0.18"

# core
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tokio-util = "0.7.20"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
oauth2 = { version = "5", default-features = false }
keyring = "4"
thiserror = "2"
anyhow = "1"

# small helpers
dirs = "7"
toml = "1"
open = "5"
url = "2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
